name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./zendaily-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zendaily-android-apk
          path: ./zendaily-android.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "ZenDaily Android App v1.0.0"
          body: |
            ### 📱 ZenDaily Android App (.apk)

            Download the compiled Android installation file below to install directly on your Android phone!

            - 📥 **Direct APK Download**: [zendaily-android.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/zendaily-android.apk)
            - **Design**: Native Android Material Design 3 (Material You / M3)
            - **Features**:
              - Custom reusable questions (create, edit, reorder, delete)
              - Quick answer distraction-free check-in
              - Separate reverse-chronological submission history (unaggregated cards)
              - Cross-device real-time sync with Supabase
              - Full offline local storage
          files: ./zendaily-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
